# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ko-KR'  # 리뷰 언어 설정
early_access: true  # 얼리 액세스 기능 활성화

# 리뷰 톤 및 스타일 지정(스키마 maxLength=250을 준수해 축약)
tone_instructions: |
  한국어(ko-KR)로 간결하고 건설적인 코드 리뷰를 제공해요. 보안, 성능, 유지보수성을 우선해요.
  컨벤션 판단은 docs/conventions.md를 기준으로 해요. 이 설정 파일의 지침과 어긋나면 conventions.md가 우선이에요.

reviews:
  profile: 'assertive'  # 리뷰 스타일: assertive(엄격), chill(관대)
  request_changes_workflow: false
  high_level_summary: true  # PR 요약 생성
  poem: false  # 시(POEM) 생성 비활성화
  review_status: true  # 리뷰 상태 표시
  assess_linked_issues: false  # 연결된 이슈 분석
  related_prs: false  # 관련 PR 표시
  suggested_labels: true  # 라벨 자동 제안
  sequence_diagrams: false  # 시퀀스 다이어그램 생성 비활성화(기본 노이즈 절감)
  changed_files_summary: true  # 변경된 파일 요약

  # 워크플로우 개선
  high_level_summary_in_walkthrough: true  # 요약을 워크스루에 포함
  high_level_summary_placeholder: '이 PR의 주요 변경사항을 요약합니다'
  collapse_walkthrough: true  # 워크스루 섹션 접기(기본은 접어서 노이즈 감소)
  commit_status: true  # 커밋 상태 체크
  fail_commit_status: false  # 커밋 실패 시 상태 체크 실패하지 않음
  related_issues: false  # 관련 이슈 추적
  abort_on_close: true  # PR 닫힐 때 리뷰 중단

  # 파일 경로 필터링 (프로젝트 구조에 맞춘 설정)
  path_filters:
    # 포함(allow-list)
    - 'src/**'
    - '.github/**'
    - 'vite.config.ts'
    - 'eslint.config.js'
    - '.prettierrc'
    - '.prettierignore'
    - 'tsconfig*.json'
    - 'package.json'
    - '.coderabbit.yaml'
    - 'docs/conventions.md' # 컨벤션 변경도 리뷰 대상
    - 'CLAUDE.md'
    - 'AGENTS.md'
    # 제외(deny-list)
    - '!node_modules/**'
    - '!dist/**'
    - '!build/**'
    - '!coverage/**'
    - '!**/*.snap'
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.jpeg'
    - '!**/*.svg'
    - '!**/*.gif'
    - '!**/*.webp'
    - '!**/*.ico'
    - '!**/*.avif'
    - '!**/*.mp4'
    - '!**/*.webm'
    - '!**/*.mp3'
    - '!**/*.ogg'
    - '!*.lock'
    - '!pnpm-lock.yaml'
    - '!package-lock.json'
    - '!bun.lockb'

  # 경로별 특별 지침 (구체적인 패턴부터 일반적인 패턴 순으로 배열)
  path_instructions:
    # 가장 구체적인 패턴들
    - path: '.coderabbit.yaml'
      instructions: |
        CodeRabbit 설정 파일 리뷰 시:
        - YAML 문법의 정확성 확인
        - 스키마 호환성 검증 (지원되지 않는 필드 사용 여부)
        - path_filters의 포함/제외 패턴 검토
        - path_instructions의 중복 또는 누락 확인
        - 프로젝트 구조와 설정의 일치성 검토

    - path: 'src/**/components/**/*.tsx'
      instructions: |
        컴포넌트 파일 리뷰 시 (네이밍·export 규칙은 conventions.md 기준, 여기서는 그 외를 봐주세요):
        - 접근성: ARIA 속성, label 연결, 키보드 포커스
        - 전체 클릭/링크 제안 시 내부에 <a>가 있는지 먼저 확인 (중첩 앵커 금지, 필요 시 overlay 링크 등 대안 제시)
        - 성능: memo/useMemo/useCallback 적절 사용
        - ref 전달 방식 (React 19이므로 forwardRef 없이 ref prop 사용 가능)

    - path: 'src/**/*.css.ts'
      instructions: |
        Vanilla Extract 스타일 파일 리뷰 시:
        - rem 계산 전제: reset.css.ts에서 html fontSize 62.5% 사용(1rem=10px) — 16px 가정으로 계산하지 않기
        - 레이아웃 전제: global.css.ts의 layoutVars(minWidth 375px, maxWidth 440px) 범위 내 모바일 고정 레이아웃
        - 디자인 토큰 활용 확인: 색상은 colorVars, 폰트는 fontVars
        - fontVars 사용법: ...fontVars.font.토큰명 형태로 스프레드 연산자와 함께 사용 (구 fontStyle() 헬퍼는 삭제됐어요)
        - #hex·rgba() 하드코딩은 conventions.md의 예외 표에 등록된 것만 허용
        - recipe와 styleVariants 패턴의 적절한 사용
        - 불필요한 중복 스타일 제거
        - 전역 스타일 남용 금지, 컴포넌트 범위 캡슐화

    - path: 'src/**/hooks/**/*.ts'
      instructions: |
        커스텀 훅 리뷰 시:
        - 파일명과 훅 이름이 일치하는지, use* 접두사를 쓰는지
        - 의존성 배열(exhaustive-deps) 준수, 참조 안정성 유지(함수/객체 메모이제이션)
        - useEffect가 정말 필요한지 — 렌더 중 계산으로 되는 파생 값이거나, 이벤트 핸들러에서 처리할 사용자 액션이면 지적해주세요.
          외부 시스템(DOM·타이머·GA·Sentry·브라우저 API) 동기화일 때만 effect가 적절해요.
        - 반환 값 일관성(tuple/object), 에러/로딩 상태 명확화
        - 쿼리 훅은 use{Subject}Query, mutation 훅은 use{Subject}Mutation (useGet* 형태는 폐기된 규칙이에요)

    - path: 'src/**/types/**/*.ts'
      instructions: |
        타입 정의 리뷰 시:
        - import type 사용, default export 지양
        - Discriminated Union으로 분기 명확화
        - 상수 리터럴은 as const로 리터럴 타입 유지

    # 중간 수준의 구체적인 패턴들
    - path: 'src/shared/components/**'
      instructions: |
        공통 컴포넌트 리뷰 시 다음 사항을 중점적으로 검토해주세요:
        - TypeScript 타입 정의의 정확성과 제네릭 활용
        - 높은 재사용성을 위한 props 설계
        - 성능 최적화 (memo, useMemo, useCallback)
        - 일관된 API 디자인과 명명 규칙
        - 접근성(a11y) 준수

    - path: 'src/pages/**/components/**'
      instructions: |
        페이지별 컴포넌트 리뷰 시:
        - 해당 페이지의 도메인 로직과 긴밀한 결합 확인
        - 재사용 가능한 컴포넌트는 shared로 이동 제안
        - 페이지 특화 타입과 상수의 적절한 활용 확인

    - path: 'src/**/apis/**'
      instructions: |
        API 레이어 리뷰 시:
        - request 래퍼 사용(axios 직접 호출 금지), 공통 에러 포맷 정규화
        - TanStack Query와의 통합(QueryKey Factory 사용) 
        - 재시도/취소 신호(AbortController) 처리 일관성
        - 타입 안정성 확보(응답 제네릭, 불변 데이터)
        - bare 함수는 HTTP메서드 + 명사 (getUserList, postComment 등), 훅은 use{Subject}Query / use{Subject}Mutation
        - 에러를 호출부에서 개별로 Sentry에 보내지 않는지 — API 실패 전송은 globalErrorHandler 한 곳에서만 해요
        - async/await 패턴 일관성 확인

    - path: 'src/routes/**'
      instructions: |
        라우팅 리뷰 시:
        - 코드 스플리팅(dynamic import)과 적절한 청크 분리
        - 라우트 전환 시 상태 보존 전략 검토
        - 중첩 라우트의 레이아웃/에러 경계 사용 확인

    - path: 'src/**/constants/**'
      instructions: |
        상수 파일 리뷰 시:
        - 모든 상수가 BIG_SNAKE_CASE로 작성되었는지 확인
        - export const 사용 확인
        - 의미있는 이름 사용 여부 확인
        - 리터럴은 as const로 타입 좁히기

    - path: 'src/**/*.ts'
      instructions: |
        TypeScript 파일 리뷰 시:
        - 타입/인터페이스는 PascalCase 사용, Type/I/T 접두사·접미사 금지 (제네릭 T 제외)
        - interface는 객체 타입, type은 union/별칭에 사용하는지 확인
        - API Response는 XXXResponse 네이밍 따르는지 확인
        - var 사용 금지, const 우선 사용 확인
        - type-only import 사용(import type), 불필요한 런타임 의존성 제거
        - satisfies 연산자 활용으로 정확한 타입 보장

    # 가장 일반적인 패턴 (마지막에 배치)
    - path: 'src/**'
      instructions: |
        전체 프로젝트 코드 리뷰 시:

        # 컨벤션 판단 기준
        네이밍·export·import·폴더 구조·스타일 토큰 규칙은 docs/conventions.md가 기준이에요.
        규칙을 여기에 다시 적지 않으니 그 문서를 읽고 판단해주세요. 이 설정과 문서가 어긋나면 문서가 우선이에요.

        # 이 레포에서 특히 자주 어긋나는 것
        - 최단 alias 위반 — 같은 경로에 더 짧은 alias가 있는데 긴 것을 쓴 경우 (@shared/styles/... → @styles/...)
        - @/ prefix 사용 (금지)
        - 페이지끼리 직접 import, shared/에서 pages/ import (경계 위반)
        - 색상·폰트 리터럴 하드코딩 (colorVars·fontVars 사용, 예외는 문서의 예외 표에 등록된 것만)
        - navigate() 경로 하드코딩 (ROUTES 상수 사용)
        - queryKeys factory를 거치지 않은 쿼리 키 배열

        # 건드리면 안 되는 것
        - shared/apis/__generated__/ — swagger 자동 생성 파일
        - /api/v2·/api/v4 URL 값과 생성 타입의 V2 표기 — 서버 유래라 개명 제안 금지

        # 보안 및 성능
        - 환경 변수는 반드시 import.meta.env 사용
        - API 키나 시크릿을 하드코딩하지 않음
        - React.memo, useMemo, useCallback의 적절한 사용
        - 큰 번들 사이즈 경고 (dynamic import 제안)

        # 커밋 및 브랜치 패턴
        - 커밋 타입: feat, fix, docs, style, refactor, test, chore, design, rename, remove
        - 브랜치 패턴: type/description/#issue-number 형식

  auto_review:
    enabled: true  # 자동 리뷰 활성화
    drafts: false  # 드래프트 리뷰 사용 여부
    base_branches:  # Git Flow와 정렬
      - 'develop'
      - 'main'
    labels:  # 라벨 기반 필터(느슨한 NOT 매칭)
      - '!wip'
      - '!draft'
      - '!skip-review'
    ignore_usernames:  # 봇 PR 무시
      - 'dependabot'
      - 'renovate'
    ignore_title_keywords:  # 특정 키워드가 포함된 PR 제목 무시
      - '[docs]'
      - '[skip-review]'

  # 사전 병합 검사(팀 규칙의 가시화, 엄격도는 warning로 시작)
  pre_merge_checks:
    title:
      mode: 'warning'
      requirements: 'PR 제목은 [type] 제목 형식을 따르고 50자 이내로 간결하게 작성해요.'
    description:
      mode: 'warning'
    issue_assessment:
      mode: 'off'

  # 코드 개선 기능 (finishing_touches) - 전역 비활성화
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  # TypeScript/React 환경에 최적화된 도구들 (실제 사용하는 것만)
  tools:
    eslint:
      enabled: true  # TypeScript/React 린팅
    languagetool:
      enabled: true  # 한국어 문법 검사
      level: 'default'
    markdownlint:
      enabled: true  # 문서 품질 검사
    gitleaks:
      enabled: true  # 보안 비밀 정보 스캔
    yamllint:
      enabled: true  # YAML 파일 검증
    actionlint:
      enabled: true  # GitHub Actions 검증

# 채팅 설정
chat:
  art: false  # 아스키/이모지 아트 비활성화(전문성 유지)
  auto_reply: true  # AI 자동 답변 활성화

# 지식 베이스 설정
knowledge_base:
  web_search:
    enabled: true  # 웹 검색 기능 활성화
  code_guidelines:
    enabled: true
    # 레포에 실제로 존재하는 경로만 나열한다 (없는 경로를 적으면 조용히 무시돼 지침 없이 리뷰됨)
    filePatterns:
      - 'docs/conventions.md' # 컨벤션 SSOT
      - 'AGENTS.md' # 매 작업 체크리스트 (CLAUDE.md는 이 파일을 import만 함)
      - 'README.md'
      - 'eslint.config.js'
      - '.prettierrc'
      - 'src/shared/styles/reset.css.ts'
      - 'src/shared/styles/global.css.ts'
